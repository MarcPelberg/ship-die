services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shipdie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-shipdie}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PUBLISH:-3000}:3000"
    command: node dist/src/web/server.js

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "while true; do node dist/src/worker/run-once.js; sleep 60; done"

  join-notifier:
    build: .
    profiles: ["join-notifications"]
    restart: unless-stopped
    env_file:
      - path: .env.join-notifier
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "while true; do node dist/src/worker/notify-joins.js; sleep 15; done"

  curator:
    image: ollama/ollama:0.40.16
    profiles: ["local-curation"]
    restart: unless-stopped
    cpus: 2
    mem_limit: 5g
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "1m"
    volumes:
      - curator-models:/root/.ollama

  reader:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - whatsapp-auth:/app/.data/wa-auth
    command: node dist/src/ingest/baileys-reader.js

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  curator-models:
  postgres-data:
  whatsapp-auth:
  caddy-data:
  caddy-config:
